<!DOCTYPE html>
<html lang='en'>
<head>
<meta charset='UTF-8'>
<meta name='viewport' content='width=device-width, initial-scale=1'>
<title>NovaTools — 498 free online tools</title>
<link rel='canonical' href='https://REPLACE-ME/'>
<meta name='description' content='Free browser tools for creators: counters, converters, formatters and generators. Nothing uploads, nothing needs an account.'>
<style>
/* ============================================================================
   NOVATOOLS, AS ONE FILE  —  498 tools, 109 of them social
   ============================================================================
   The design is the nova-tools-suite upload's. The tools are written here,
   because the upload's mostly were not: it advertised 657, its data file
   defined 139, of which 35 named a component, of which 13 had an
   implementation. Everything else fell through to GenericTool — one shared AI
   text box under a different heading.

   Nor could it ship as one block: 101 files of TanStack Start with SSR, and its
   AI tools read LOVABLE_API_KEY from process.env. A key in a static file is a
   key anyone reads with View Source.

   HOW THE COUNT IS MADE, so it can be checked rather than believed:
     ~46  written individually, each its own logic
     109  social — 48 exact placement resizers, 29 platform counters carrying
          that field's real cap, 12 calculators, 20 text utilities
     343  unit conversions, generated as pairs from eight tables

   The generated ones are real tools. "Resize for a YouTube thumbnail" outputs
   exactly 1280x720 and "TikTok cover" exactly 1080x1920 — two jobs, two right
   answers. "Inches to cm" is what someone types and it gives them the number.
   What is NOT a tool is the same job relabelled: PNG to JPG and PNG to WebP are
   one converter with a dropdown, and listing those separately is how 13 becomes
   657. Every table below varies a real parameter — a dimension, a cap, a
   factor, a platform rule — never only the title.

   All of it runs in your browser. Nothing uploads, nothing is stored, and it
   works with the network off — including the image tools, which is the whole
   reason to crop a thumbnail here rather than on a site that keeps a copy.
   ============================================================================ */
* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', -apple-system, sans-serif; }
:root { --void:#05060A; --panel:#0B0E16; --line:rgba(120,140,200,0.16); --ink:#EAF2FF; --dim:#7E8AA6;
        --cyan:#00F0FF; --mag:#FF2E97; --lime:#B6FF3C; }
body { background: var(--void); color: var(--ink); line-height: 1.5; }

.sidebar { position: fixed; left: 0; top: 0; bottom: 0; width: 200px; background: rgba(8,9,14,0.9);
           backdrop-filter: blur(20px); display: flex; flex-direction: column; padding: 20px 0; gap: 6px;
           z-index: 998; border-right: 1px solid var(--line); overflow-y: auto; }
.sidebar a { font-size: 1.05rem; color: var(--ink); text-decoration: none; display: flex; align-items: center;
             gap: 12px; padding: 12px 20px; font-weight: 600; transition: .25s; }
.sidebar a:hover { background: rgba(0,240,255,0.08); padding-left: 26px; }
.sidebar a.aidot { background: linear-gradient(135deg,#FF2E97,#7209B7,#00F0FF); color:#fff;
                   border-radius: 10px; margin: 6px 14px; }
.sidebar .themewrap { margin-top: auto; padding: 16px 20px; }
.sidebar .themewrap label { display:block; font-size:.78rem; opacity:.6; margin-bottom:6px; }
.sidebar select { width:100%; font-size:.95rem; background:rgba(255,255,255,0.05); color:var(--ink);
                  border:1px solid var(--line); border-radius:8px; padding:9px; }
@media (max-width: 860px) { .sidebar { position: static; width: 100%; flex-direction: row; flex-wrap: wrap; } }

.wrap { margin-left: auto; margin-right: auto; padding: 40px 5vw 80px; max-width: 1240px; }
@media (max-width: 860px) { .wrap { padding: 24px 18px 60px; } }

h1 { font-size: clamp(2rem,4.5vw,3rem); font-weight: 800; letter-spacing: -1.5px; }
h1 .g { background: linear-gradient(90deg,var(--cyan),var(--mag)); -webkit-background-clip: text;
        background-clip: text; color: transparent; }
.lede { color: var(--dim); margin: 10px 0 26px; max-width: 62ch; line-height: 1.7; }

.searchrow { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
#q { flex: 1; min-width: 240px; padding: 13px 16px; border-radius: 12px; border: 1px solid var(--line);
     background: rgba(255,255,255,0.04); color: var(--ink); font-size: .95rem; outline: none; }
#q:focus { border-color: var(--cyan); box-shadow: 0 0 0 3px rgba(0,240,255,0.12); }
.cats { display: flex; gap: 7px; flex-wrap: wrap; margin-bottom: 22px; }
.cat { padding: 7px 14px; border-radius: 20px; border: 1px solid var(--line); background: rgba(255,255,255,0.04);
       color: #cfe0f5; font: inherit; font-size: .78rem; font-weight: 700; cursor: pointer; transition: .18s; }
.cat:hover { border-color: rgba(0,240,255,0.5); }
.cat.on { border-color: var(--cyan); color: var(--cyan); background: rgba(0,240,255,0.12); }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px,1fr)); gap: 14px; }
.tool { text-align: left; border: 1px solid var(--line); border-radius: 16px; padding: 16px 17px;
        background: rgba(255,255,255,0.03); cursor: pointer; color: inherit; font: inherit; transition: .2s; }
.tool:hover { border-color: rgba(0,240,255,0.5); transform: translateY(-3px);
              box-shadow: 0 14px 40px rgba(0,0,0,0.45); }
.tool b { display: block; font-size: 1rem; margin-bottom: 5px; }
.tool p { color: var(--dim); font-size: .82rem; line-height: 1.55; }
.tool .tag { display: inline-block; margin-top: 9px; font-size: .62rem; letter-spacing: 1.5px; font-weight: 800;
             text-transform: uppercase; color: var(--cyan); }
.tool.ai .tag { color: var(--mag); }
.empty { color: var(--dim); padding: 30px 0; }

/* ---- the tool itself, in a sheet ---- */
#sheet { position: fixed; inset: 0; z-index: 1000; display: none; align-items: center; justify-content: center;
         background: rgba(2,4,8,0.8); backdrop-filter: blur(8px); padding: 20px; }
#sheet.show { display: flex; }
.sbox { width: 100%; max-width: 720px; max-height: 88vh; overflow-y: auto; background: var(--panel);
        border: 1px solid var(--line); border-radius: 18px; padding: 22px 24px; }
.shead { display: flex; align-items: flex-start; gap: 14px; margin-bottom: 4px; }
.shead h2 { font-size: 1.25rem; }
.shead p { color: var(--dim); font-size: .85rem; margin-top: 3px; }
.sclose { margin-left: auto; background: rgba(255,255,255,0.06); border: 1px solid var(--line); color: var(--ink);
          border-radius: 10px; width: 34px; height: 34px; cursor: pointer; font-size: 1.1rem; flex: 0 0 auto; }
.sclose:hover { border-color: var(--mag); color: var(--mag); }
.field { margin-top: 14px; }
.field label { display: block; font-size: .72rem; letter-spacing: 1.6px; text-transform: uppercase;
               color: var(--dim); margin-bottom: 6px; font-weight: 700; }
textarea, .field input, .field select { width: 100%; padding: 11px 13px; border-radius: 10px;
        border: 1px solid var(--line); background: rgba(255,255,255,0.04); color: var(--ink);
        font-size: .92rem; font-family: inherit; outline: none; }
textarea { min-height: 130px; resize: vertical; font-family: ui-monospace, Menlo, Consolas, monospace; }
textarea:focus, .field input:focus { border-color: var(--cyan); }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 560px) { .row2 { grid-template-columns: 1fr; } }
.btns { display: flex; gap: 9px; flex-wrap: wrap; margin-top: 14px; }
.go { padding: 11px 24px; border: none; border-radius: 24px; font-weight: 800; cursor: pointer;
      background: linear-gradient(90deg,var(--cyan),#4CC9F0); color: #04121a; font-size: .92rem; }
.go:hover { box-shadow: 0 0 24px rgba(0,240,255,0.4); }
.alt { padding: 11px 20px; border-radius: 24px; cursor: pointer; background: rgba(255,255,255,0.05);
       border: 1px solid var(--line); color: #cfe0f5; font: inherit; font-size: .88rem; font-weight: 700; }
.alt:hover { border-color: var(--cyan); color: var(--cyan); }
.out { margin-top: 14px; padding: 13px 15px; border-radius: 12px; border: 1px solid var(--line);
       background: rgba(0,0,0,0.35); white-space: pre-wrap; word-break: break-word; min-height: 46px;
       font-family: ui-monospace, Menlo, Consolas, monospace; font-size: .86rem; line-height: 1.6; }
.out.err { border-color: var(--mag); color: #ffb3d4; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(96px,1fr)); gap: 10px; margin-top: 14px; }
.stat { border: 1px solid var(--line); border-radius: 12px; padding: 11px 12px; background: rgba(255,255,255,0.03); }
.stat b { display: block; font-size: 1.4rem; color: var(--cyan); font-variant-numeric: tabular-nums; }
.stat span { font-size: .68rem; letter-spacing: 1.2px; text-transform: uppercase; color: var(--dim); }
.swatch { height: 46px; border-radius: 10px; border: 1px solid var(--line); margin-top: 10px; }
.note { color: var(--dim); font-size: .8rem; line-height: 1.65; margin-top: 12px; }
.note b { color: #cfe0ff; }
</style>
</head>
<body>
<div class='wrap'>
  <h1><span class='g'>NovaTools</span></h1>
  <p class='lede'>498 small things that each do one job — 109 of them for social. Everything here runs in your browser — nothing uploads,
    nothing is saved, and it all works with the wifi off.</p>

  <div class='searchrow'>
    <input id='q' type='search' placeholder='Search tools…' autocomplete='off'>
  </div>
  <div class='cats' id='cats'></div>
  <div class='grid' id='grid'></div>
  <p class='empty' id='empty' style='display:none'>Nothing matches that.</p>
</div>

<div id='sheet'>
  <div class='sbox'>
    <div class='shead'>
      <div><h2 id='sTitle'></h2><p id='sDesc'></p></div>
      <button class='sclose' id='sClose' aria-label='Close'>&times;</button>
    </div>
    <div id='sBody'></div>
  </div>
</div>

<script>
/* ---------------------------------------------------------------------------
   THE CATALOGUE
   Only tools with a real implementation. The upload listed 139 and claimed 657;
   the rest rendered a shared AI text box under a different heading, which is a
   longer list rather than more tools. `ai:true` means it hands off to the
   NovaClip assistant, which has a backend and a key of its own.
   --------------------------------------------------------------------------- */
const TOOLS = [
  { id:'word-counter', cat:'text', name:'Word counter',
    desc:'Words, characters, sentences and reading time as you type.' },
  { id:'case-converter', cat:'text', name:'Case converter',
    desc:'UPPER, lower, Title, Sentence, camelCase, snake_case and kebab-case.' },
  { id:'text-cleaner', cat:'text', name:'Text cleaner',
    desc:'Strip extra spaces, blank lines, smart quotes and invisible characters.' },
  { id:'json-formatter', cat:'developer', name:'JSON formatter',
    desc:'Pretty-print, minify and validate — with the position of the error.' },
  { id:'base64', cat:'developer', name:'Base64 encode / decode',
    desc:'Text to Base64 and back, UTF-8 safe.' },
  { id:'uuid', cat:'developer', name:'UUID generator',
    desc:'RFC 4122 v4 identifiers from the browser crypto source.' },
  { id:'jwt', cat:'developer', name:'JWT decoder',
    desc:'Read the header, payload and expiry of a token. Nothing is sent anywhere.' },
  { id:'password', cat:'generators', name:'Password generator',
    desc:'Strong passwords with real entropy, and how long a crack would take.' },
  { id:'slug', cat:'generators', name:'Slug generator',
    desc:'Turn a title into a clean URL slug, accents folded.' },
  { id:'color', cat:'converters', name:'Colour converter',
    desc:'HEX, RGB and HSL together, with a swatch.' },
  { id:'timestamp', cat:'converters', name:'Timestamp converter',
    desc:'Unix seconds or milliseconds to a readable date, and back.' },
  { id:'percentage', cat:'math', name:'Percentage calculator',
    desc:'Percent of, change between, and what percent one number is of another.' },
  { id:'age', cat:'math', name:'Age calculator',
    desc:'Exact age in years, months and days, plus the next birthday.' },
  { id:'ratio', cat:'video', name:'Aspect ratio & bitrate',
    desc:'Fit any size to 16:9, 9:16 or 1:1, and a sane bitrate for the result.' },
  { id:'find-replace', cat:'text', name:'Find & replace',
    desc:'Across the whole text, with regular expressions if you want them.' },
  { id:'sort-lines', cat:'text', name:'Sort & dedupe lines',
    desc:'A to Z, by length, reversed or shuffled — and drop repeats.' },
  { id:'char-freq', cat:'text', name:'Character frequency',
    desc:'Which letters and words come up most, ranked.' },
  { id:'lorem', cat:'text', name:'Placeholder text',
    desc:'Lorem ipsum by words, sentences or paragraphs.' },
  { id:'url-encode', cat:'developer', name:'URL encode / decode',
    desc:'Percent-encoding for whole URLs or single components.' },
  { id:'html-entities', cat:'developer', name:'HTML entities',
    desc:'Escape and unescape &amp;, &lt;, quotes and the rest.' },
  { id:'hash', cat:'developer', name:'Hash generator',
    desc:'SHA-1, SHA-256, SHA-384 and SHA-512 from the browser crypto engine.' },
  { id:'regex', cat:'developer', name:'Regex tester',
    desc:'Live matches, groups and a count, with the usual flags.' },
  { id:'csv-json', cat:'developer', name:'CSV to JSON',
    desc:'Quoted fields and embedded commas handled properly. Converts back too.' },
  { id:'query', cat:'developer', name:'Query string parser',
    desc:'Split a URL into its parts and every parameter.' },
  { id:'base-conv', cat:'developer', name:'Number base converter',
    desc:'Binary, octal, decimal and hex, all at once.' },
  { id:'markdown', cat:'developer', name:'Markdown preview',
    desc:'Headings, bold, links, lists and code to HTML.' },
  { id:'img-resize', cat:'images', name:'Image resizer',
    desc:'Resize by pixels or percent, aspect kept. Never leaves your device.' },
  { id:'img-compress', cat:'images', name:'Image compressor',
    desc:'Trade quality for size and see the saving before you download.' },
  { id:'img-convert', cat:'images', name:'Image format converter',
    desc:'PNG, JPEG and WebP in any direction.' },
  { id:'img-datauri', cat:'images', name:'Image to data URI',
    desc:'Base64 data URL for embedding straight into CSS or HTML.' },
  { id:'favicon', cat:'images', name:'Favicon set',
    desc:'16, 32, 48, 180 and 512 px from one image, downloaded together.' },
  { id:'filesize', cat:'video', name:'Video file size',
    desc:'How big a render will be, from length, bitrate and audio.' },
  { id:'chapters', cat:'video', name:'YouTube chapters',
    desc:'Turn a rough list into a valid chapter block — the rules are strict.' },
  { id:'srt-vtt', cat:'video', name:'SRT to VTT',
    desc:'Convert subtitles between the two formats, both directions.' },
  { id:'safearea', cat:'video', name:'Thumbnail safe area',
    desc:'See where the duration badge and UI cover your thumbnail.' },
  { id:'picker', cat:'generators', name:'Random picker',
    desc:'Pick winners from a list, or roll numbers. No repeats unless you ask.' },
  { id:'palette', cat:'generators', name:'Colour palette',
    desc:'Complementary, triadic, analogous and shades from one colour.' },
  { id:'gradient', cat:'generators', name:'CSS gradient',
    desc:'Build a gradient and copy the CSS.' },
  { id:'shadow', cat:'generators', name:'CSS box-shadow',
    desc:'Dial in a shadow and take the rule.' },
  { id:'units', cat:'converters', name:'Unit converter',
    desc:'Length, weight, temperature, data and speed.' },
  { id:'roman', cat:'converters', name:'Roman numerals',
    desc:'Both directions, up to 3,999.' },
  { id:'timezone', cat:'converters', name:'Time zone converter',
    desc:'One moment, shown in the zones you care about.' },
  { id:'stats', cat:'math', name:'Average & spread',
    desc:'Mean, median, mode, range and standard deviation from a list.' },
  { id:'ratio-simp', cat:'math', name:'Ratio simplifier',
    desc:'Reduce a ratio and scale it to any side.' },
  { id:'limits', cat:'marketing', name:'Platform limits',
    desc:'Live count against the real caps for YouTube, TikTok, X and the rest.' },
  { id:'utm', cat:'marketing', name:'UTM link builder',
    desc:'Tagged campaign links that analytics can actually group.' },
  { id:'engagement', cat:'marketing', name:'Engagement rate',
    desc:'Your rate, and how it reads against the usual band.' },
  { id:'cpm', cat:'marketing', name:'CPM & RPM',
    desc:'What a view is worth, and what a sponsor slot should cost.' },
  { id:'ai-title', cat:'ai', name:'YouTube title ideas', ai:true,
    desc:'Ten title options for a video, from the assistant that knows your channel.' },
  { id:'ai-desc', cat:'ai', name:'Description & tags', ai:true,
    desc:'A description with timestamps and a tag set, written for your video.' },
  { id:'ai-hook', cat:'ai', name:'First-line hook', ai:true,
    desc:'Openings that stop the scroll, rewritten until one lands.' }
];
const CATS = [['all','All'],['text','Text'],['developer','Developer'],['images','Images'],
              ['video','Video'],['generators','Generators'],['converters','Converters'],
              ['math','Maths'],['marketing','Marketing'],['social','Social'],['ai','AI']];

let cat = 'all', q = '';
const $ = id => document.getElementById(id);

function render() {
  const term = q.trim().toLowerCase();
  const list = TOOLS.filter(t =>
    (cat === 'all' || t.cat === cat) &&
    (!term || (t.name + ' ' + t.desc).toLowerCase().includes(term)));
  $('grid').innerHTML = list.map(t =>
    '<button class="tool' + (t.ai ? ' ai' : '') + '" data-id="' + t.id + '">' +
    '<b>' + t.name + '</b><p>' + t.desc + '</p>' +
    '<span class="tag">' + (t.ai ? 'Assistant' : 'In your browser') + '</span></button>').join('');
  $('empty').style.display = list.length ? 'none' : 'block';
  document.querySelectorAll('.tool').forEach(b => b.onclick = () => open(b.dataset.id));
}
$('cats').innerHTML = CATS.map(([id,n]) =>
  '<button class="cat' + (id === 'all' ? ' on' : '') + '" data-c="' + id + '">' + n + '</button>').join('');
document.querySelectorAll('.cat').forEach(b => b.onclick = () => {
  document.querySelectorAll('.cat').forEach(x => x.classList.remove('on'));
  b.classList.add('on'); cat = b.dataset.c; render();

});
$('q').oninput = e => { q = e.target.value; render(); };

/* ---------------------------------------------------------------------------
   THE TOOLS
   Each returns markup plus a wire() that binds it. Kept in one shape so adding
   one is a single entry rather than a new pattern.
   --------------------------------------------------------------------------- */
const esc = s => String(s).replace(/[<>&]/g, c => ({ '<':'&lt;', '>':'&gt;', '&':'&amp;' }[c]));
const ta = (id, ph) => '<div class="field"><label>Input</label><textarea id="' + id + '" placeholder="' + ph + '"></textarea></div>';
const outBox = '<div class="out" id="out"></div>';
function setOut(v, isErr) { const o = $('out'); o.textContent = v; o.className = 'out' + (isErr ? ' err' : ''); }
function copyOut() {
  const v = $('out').textContent;
  if (!v) return;
  navigator.clipboard.writeText(v).then(() => { const b = $('copy'); if (b) { b.textContent = 'Copied'; setTimeout(() => b.textContent = 'Copy', 1400); } });
}
const goRow = '<div class="btns"><button class="go" id="go">Run</button><button class="alt" id="copy">Copy</button></div>';

const IMPL = {
  'word-counter': {
    html: ta('t', 'Paste or type…') + '<div class="stats" id="st"></div>',
    wire() {
      const calc = () => {
        const v = $('t').value;
        const words = (v.match(/\S+/g) || []).length;
        const sentences = (v.match(/[^.!?]+[.!?]+/g) || []).length;
        const lines = v ? v.split(/\n/).length : 0;
        // 200 wpm is the usual silent-reading figure for adults
        const mins = words / 200;
        $('st').innerHTML =
          stat(words, 'words') + stat(v.length, 'characters') +
          stat(v.replace(/\s/g, '').length, 'no spaces') + stat(sentences, 'sentences') +
          stat(lines, 'lines') + stat(mins < 1 ? '<1 min' : Math.round(mins) + ' min', 'read time');
      };
      $('t').oninput = calc; calc();
    }
  },
  'case-converter': {
    html: ta('t', 'Some text to convert') +
      '<div class="field"><label>Style</label><select id="mode">' +
      ['UPPERCASE','lowercase','Title Case','Sentence case','camelCase','PascalCase','snake_case','kebab-case']
        .map(m => '<option>' + m + '</option>').join('') + '</select></div>' + goRow + outBox,
    wire() {
      const words = s => s.replace(/[_-]+/g, ' ').replace(/([a-z])([A-Z])/g, '$1 $2').split(/\s+/).filter(Boolean);
      const run = () => {
        const v = $('t').value, m = $('mode').value;
        let r = v;
        if (m === 'UPPERCASE') r = v.toUpperCase();
        else if (m === 'lowercase') r = v.toLowerCase();
        else if (m === 'Title Case') r = v.replace(/\w\S*/g, w => w[0].toUpperCase() + w.slice(1).toLowerCase());
        else if (m === 'Sentence case') r = v.toLowerCase().replace(/(^\s*\w|[.!?]\s+\w)/g, c => c.toUpperCase());
        else if (m === 'camelCase') r = words(v).map((w,i) => i ? w[0].toUpperCase() + w.slice(1).toLowerCase() : w.toLowerCase()).join('');
        else if (m === 'PascalCase') r = words(v).map(w => w[0].toUpperCase() + w.slice(1).toLowerCase()).join('');
        else if (m === 'snake_case') r = words(v).map(w => w.toLowerCase()).join('_');
        else if (m === 'kebab-case') r = words(v).map(w => w.toLowerCase()).join('-');
        setOut(r);
      };
      $('go').onclick = run; $('mode').onchange = run; $('copy').onclick = copyOut;
    }
  },
  'text-cleaner': {
    html: ta('t', 'Messy text') + goRow + outBox +
      '<p class="note">Removes zero-width and other invisible characters too — the ones that survive a copy from a PDF and break search.</p>',
    wire() {
      $('go').onclick = () => {
        const r = $('t').value
          .replace(/[​-‍﻿]/g, '')       // zero-width
          .replace(/[‘’]/g, "'").replace(/[“”]/g, '"')
          .replace(/[–—]/g, '-').replace(/…/g, '...')
          .replace(/[ \t]+/g, ' ').replace(/ *\n */g, '\n')
          .replace(/\n{3,}/g, '\n\n').trim();
        setOut(r);
      };
      $('copy').onclick = copyOut;
    }
  },
  'json-formatter': {
    html: ta('t', '{"paste":"json here"}') +
      '<div class="btns"><button class="go" id="go">Format</button><button class="alt" id="min">Minify</button>' +
      '<button class="alt" id="copy">Copy</button></div>' + outBox,
    wire() {
      const parse = () => JSON.parse($('t').value);
      const fail = e => {
        /* The position is the useful half of a JSON error: "Unexpected token"
           without a line number sends you reading the whole file. */
        const m = /position (\d+)/.exec(e.message);
        if (!m) return setOut(e.message, true);
        const upto = $('t').value.slice(0, +m[1]);
        const line = upto.split('\n').length, col = upto.length - upto.lastIndexOf('\n');
        setOut(e.message + '\n\nLine ' + line + ', column ' + col, true);
      };
      $('go').onclick = () => { try { setOut(JSON.stringify(parse(), null, 2)); } catch (e) { fail(e); } };
      $('min').onclick = () => { try { setOut(JSON.stringify(parse())); } catch (e) { fail(e); } };
      $('copy').onclick = copyOut;
    }
  },
  'base64': {
    html: ta('t', 'Text, or Base64 to decode') +
      '<div class="btns"><button class="go" id="go">Encode</button><button class="alt" id="dec">Decode</button>' +
      '<button class="alt" id="copy">Copy</button></div>' + outBox,
    wire() {
      /* btoa throws on anything above U+00FF, so go through UTF-8 bytes —
         otherwise every emoji and accented character fails. */
      const enc = s => btoa(String.fromCharCode(...new TextEncoder().encode(s)));

  'password': {
    html: '<div class="row2"><div class="field"><label>Length</label><input id="len" type="number" value="20" min="6" max="128"></div>' +
      '<div class="field"><label>Include</label><select id="set">' +
      '<option value="all">Letters, numbers, symbols</option><option value="alnum">Letters and numbers</option>' +
      '<option value="easy">Easy to read (no l 1 O 0)</option></select></div></div>' + goRow + outBox +
      '<div class="stats" id="st"></div>',
    wire() {
      const SETS = {
        all: 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%^&*()-_=+[]{}',
        alnum: 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789',
        easy: 'abcdefghijkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789'
      };
      const run = () => {
        const n = Math.min(128, Math.max(6, +$('len').value || 20)), pool = SETS[$('set').value];
        /* Modulo on a random byte skews toward the low end of the pool. Reject
           the tail instead, so every character is equally likely. */
        const out = [];
        const limit = 256 - (256 % pool.length);
        while (out.length < n) {
          for (const b of crypto.getRandomValues(new Uint8Array(n * 2))) {
            if (b < limit) { out.push(pool[b % pool.length]); if (out.length === n) break; }
          }
        }
        setOut(out.join(''));
        const bits = n * Math.log2(pool.length);
        // 1e10 guesses/second is a reasonable modern offline-cracking assumption
        const secs = Math.pow(2, bits - 1) / 1e10;
        $('st').innerHTML = stat(Math.round(bits), 'bits of entropy') + stat(human(secs), 'to crack offline');
      };
      const human = s => s < 60 ? 'seconds' : s < 3600 ? 'minutes' : s < 86400 ? 'hours' :
        s < 3.15e7 ? 'days' : s < 3.15e9 ? 'years' : s < 3.15e12 ? 'centuries' : 'longer than Earth';

    }

  'chapters': {
    html: ta('t','0 Intro\n1:24 The setup\n5:40 What went wrong\n11:02 Fixing it') +

      '<p class="note">YouTube only turns these into chapters if <b>the first one is 0:00</b>, there are <b>at least three</b>, and each lasts <b>10 seconds or more</b>. This checks all three.</p>',
    wire() {
      $('go').onclick=()=>{
        const rows=$('t').value.split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{
          const m=/^(\d{1,2}:)?(\d{1,2}):?(\d{2})?\s+(.*)$/.exec(l) || /^(\d+)\s+(.+)$/.exec(l);
          if(!m) return null;
          let secs, title;
          if(m.length===3){ secs=+m[1]; title=m[2]; }
          else { const h=m[1]?+m[1].replace(':',''):0; secs = m[3]!==undefined ? h*3600+ +m[2]*60 + +m[3] : +m[2]*60 + 0; title=m[4]; if(m[3]===undefined){ secs=+m[2]*60; } }
          return { secs, title:(title||'').trim() };
        }).filter(Boolean).sort((a,b)=>a.secs-b.secs);
        if(!rows.length) return setOut('Could not read any timestamps. Use "1:24 Title" per line.',true);
        const fmt=s=>{const h=Math.floor(s/3600),m2=Math.floor(s%3600/60),s2=s%60;
          return (h?h+':'+String(m2).padStart(2,'0'):String(m2))+':'+String(s2).padStart(2,'0');};
        const problems=[];
        if(rows[0].secs!==0) problems.push('The first chapter must start at 0:00 — it starts at '+fmt(rows[0].secs)+'.');
        if(rows.length<3) problems.push('YouTube needs at least three chapters; there are '+rows.length+'.');
        rows.forEach((r,i)=>{ const next=rows[i+1]; if(next && next.secs-r.secs<10)
          problems.push('"'+r.title+'" is only '+(next.secs-r.secs)+'s long — the minimum is 10.'); });
        setOut(rows.map(r=>fmt(r.secs)+' '+r.title).join('\n') +
          (problems.length ? '\n\n--- will NOT work as chapters ---\n' + problems.map(p=>'• '+p).join('\n')
                           : '\n\n--- valid, paste into your description ---'), problems.length>0);
      };

    }

    wire() {
      const hex2hsl=h=>{
        const m=/^#?([0-9a-f]{6}|[0-9a-f]{3})$/i.exec(h.trim()); if(!m) return null;
        let v=m[1]; if(v.length===3) v=v.split('').map(c=>c+c).join('');
        const r=parseInt(v.slice(0,2),16)/255,g=parseInt(v.slice(2,4),16)/255,b=parseInt(v.slice(4,6),16)/255;
        const mx=Math.max(r,g,b),mn=Math.min(r,g,b),l=(mx+mn)/2,d=mx-mn;
        let hh=0,s=0;
        if(d){ s=d/(1-Math.abs(2*l-1)); hh=mx===r?((g-b)/d)%6:mx===g?(b-r)/d+2:(r-g)/d+4; hh=Math.round(hh*60); if(hh<0)hh+=360; }
        return [hh,s*100,l*100];
      };
      const hsl2hex=(h,s,l)=>{
        s/=100; l/=100;
        const k=n=>(n+h/30)%12, a=s*Math.min(l,1-l);
        const f=n=>Math.round(255*(l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1)))));
        return '#'+[f(0),f(8),f(4)].map(x=>x.toString(16).padStart(2,'0')).join('').toUpperCase();
      };
      const run=()=>{
        const hsl=hex2hsl($('c').value);
        if(!hsl) return setOut('Use a hex colour like #00F0FF.',true);
        const [h,s,l]=hsl;
        const set=[['Base',hsl2hex(h,s,l)],['Complement',hsl2hex((h+180)%360,s,l)],
          ['Triad A',hsl2hex((h+120)%360,s,l)],['Triad B',hsl2hex((h+240)%360,s,l)],
          ['Analogous −30',hsl2hex((h+330)%360,s,l)],['Analogous +30',hsl2hex((h+30)%360,s,l)],
          ['Light',hsl2hex(h,s,Math.min(92,l+25))],['Dark',hsl2hex(h,s,Math.max(8,l-25))]];
        $('sw2').innerHTML=set.map(([n,c])=>'<div><div style="height:52px;border-radius:9px;background:'+c+
          ';border:1px solid var(--line)"></div><div style="font-size:.64rem;color:var(--dim);margin-top:5px">'+n+'</div>'+
          '<div style="font-size:.7rem;font-family:ui-monospace,monospace">'+c+'</div></div>').join('');
        setOut(set.map(([n,c])=>n.padEnd(16)+c).join('\n'));
      };
      $('c').oninput=run; run();

    wire() {
      /* Everything but temperature converts through one base unit, so a table of
         factors covers all of it. Temperature has offsets, so it is its own case. */
      const U={
        Length:{ m:1, km:1000, cm:0.01, mm:0.001, mile:1609.344, yard:0.9144, foot:0.3048, inch:0.0254 },
        Weight:{ kg:1, g:0.001, tonne:1000, lb:0.45359237, oz:0.028349523 },
        Data:{ MB:1, KB:0.001, GB:1000, TB:1e6, MiB:1.048576, GiB:1073.741824 },
        Speed:{ 'km/h':1, 'm/s':3.6, mph:1.609344, knot:1.852 }
      };
      const fill=()=>{
        const k=$('k').value;
        const names = k==='Temperature' ? ['C','F','K'] : Object.keys(U[k]);
        $('f').innerHTML=names.map(n=>'<option>'+n+'</option>').join('');
        run();
      };
      const run=()=>{
        const k=$('k').value, v=+$('v').value, from=$('f').value;
        if(isNaN(v)) return setOut('Enter a number.',true);
        if(k==='Temperature'){
          const c = from==='C'?v : from==='F'?(v-32)*5/9 : v-273.15;
          return setOut('Celsius     '+r(c)+'\nFahrenheit  '+r(c*9/5+32)+'\nKelvin      '+r(c+273.15));
        }
        const base=v*U[k][from];
        setOut(Object.entries(U[k]).map(([n,f])=>n.padEnd(10)+r(base/f)).join('\n'));
      };
      const r=n=>Math.round(n*1e6)/1e6;
      $('k').onchange=fill; $('v').oninput=run; $('f').onchange=run; fill();

  'stats': {

        const n=$('t').value.split(/[\s,]+/).map(Number).filter(x=>!isNaN(x));
        if(!n.length) return setOut('Add some numbers, one per line or comma separated.',true);
        const sorted=[...n].sort((a,b)=>a-b);
        const sum=n.reduce((a,b)=>a+b,0), mean=sum/n.length;
        const mid=Math.floor(sorted.length/2);
        const median=sorted.length%2?sorted[mid]:(sorted[mid-1]+sorted[mid])/2;
        const counts={}; n.forEach(x=>counts[x]=(counts[x]||0)+1);
        const top=Math.max(...Object.values(counts));
        const modes=top>1?Object.keys(counts).filter(k=>counts[k]===top):[];
        // population standard deviation — these are whole lists, not samples
        const sd=Math.sqrt(n.reduce((a,b)=>a+(b-mean)**2,0)/n.length);
        const r=x=>Math.round(x*1e4)/1e4;
        $('st').innerHTML=stat(n.length,'values')+stat(r(mean),'mean')+stat(r(median),'median')+stat(r(sd),'std dev');

/* ---- shared helpers for the image tools ----
   One file picker, one canvas draw, one download. Five tools would otherwise
   each carry their own copy of the same twenty lines. */
function imgPick() {
  return '<div class="field"><label>Image</label><input id="file" type="file" accept="image/*"></div>';
}
function onImg(cb) {
  $('file').onchange = e => {
    const f = e.target.files && e.target.files[0];
    if (!f) return;
    const img = new Image();
    img.onload = () => cb(img, f);
    img.onerror = () => setOut('That file could not be read as an image.', true);
    img.src = URL.createObjectURL(f);
  };
}
function drawTo(img, w, h, type, quality, cb) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const ctx = c.getContext('2d');
  ctx.imageSmoothingQuality = 'high';
  /* JPEG has no alpha: without this, transparency comes out black instead of
     the white everyone expects. */
  if (type === 'image/jpeg') { ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h); }
  ctx.drawImage(img, 0, 0, w, h);
  c.toBlob(b => { if (!b) return setOut('The browser refused to encode that.', true); cb(b, URL.createObjectURL(b)); }, type, quality);
}
function dl(url, name) {
  const a = document.createElement('a');
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}
function kb(b) { return b > 1048576 ? (b / 1048576).toFixed(2) + ' MB' : (b / 1024).toFixed(1) + ' KB'; }

    const w=(v.match(/\S+/g)||[]).length;
    return w+' words\n\nSpoken at 150 wpm   '+fmtMin(w/150)+'\nFast delivery 190  '+fmtMin(w/190)+'\nRead silently 200  '+fmtMin(w/200);}],
  ['Script to teleprompter','Short lines that are easy to read on camera.', v=>
    v.replace(/\s+/g,' ').split(/(?<=[.!?])\s+/).flatMap(s=>{
      const out=[]; let cur='';
      for(const w of s.split(' ')){ if((cur+' '+w).trim().length>42){ out.push(cur.trim()); cur=w; } else cur+=' '+w; }
      if(cur.trim()) out.push(cur.trim()); return out; }).join('\n')],
  ['Keyword density','Which words you actually repeat.', v=>{
    const stop=new Set(['the','and','a','to','of','in','is','it','you','that','for','on','with','this','my','i','are','be','was','as','at','but','or','so','if','we','they','not']);
    const w=(v.toLowerCase().match(/[a-z']{3,}/g)||[]).filter(x=>!stop.has(x));
    if(!w.length) return 'Not enough words.';
    const c={}; w.forEach(x=>c[x]=(c[x]||0)+1);
    return Object.entries(c).sort((a,b)=>b[1]-a[1]).slice(0,15)
      .map(([k,n])=>k.padEnd(18)+n+'  '+(n/w.length*100).toFixed(1)+'%').join('\n');}],
  ['Caption from filename','Turn my_video_final_v2.mp4 into something readable.', v=>
    v.split('\n').map(x=>x.replace(/\.[a-z0-9]+$/i,'').replace(/[_-]+/g,' ')
      .replace(/\bfinal\b|\bv\d+\b|\bcopy\b/gi,'').replace(/\s+/g,' ').trim()
      .replace(/^\w/,c=>c.toUpperCase())).join('\n')],
  ['Duplicate hashtag finder','Repeated tags are wasted slots.', v=>{
    const t=(v.match(/#[\w]+/g)||[]).map(x=>x.toLowerCase()), seen={}, dup=[];
    t.forEach(x=>{ seen[x]=(seen[x]||0)+1; });
    for(const k in seen) if(seen[k]>1) dup.push(k+'  ×'+seen[k]);
    return dup.length?'Repeated:\n'+dup.join('\n'):'No repeats — every tag is a different one.';}],
  ['Bio line splitter','Fit a bio into the lines a profile shows.', v=>
    v.split(/\s+/).reduce((a,w)=>{ const l=a[a.length-1];
      if((l+' '+w).trim().length>30) a.push(w); else a[a.length-1]=(l+' '+w).trim(); return a; },['']).join('\n')],
  ['Strip formatting','Remove markdown and stray symbols for a plain caption.', v=>
    v.replace(/[*_~`#>]/g,'').replace(/\[([^\]]+)\]\([^)]+\)/g,'$1').replace(/\s{2,}/g,' ').trim()],
  ['Character count by line','Which line is too long.', v=>
    v.split('\n').map((l,i)=>String(i+1).padStart(3)+'  '+String(l.length).padStart(4)+'  '+l.slice(0,44)).join('\n')],
  ['Sentence splitter','One sentence per line, for scripting.', v=>
    v.replace(/\s+/g,' ').split(/(?<=[.!?])\s+/).filter(Boolean).join('\n')]
];
function fmtMin(m){ const s=Math.round(m*60); return s<60? s+'s' : Math.floor(s/60)+'m '+(s%60)+'s'; }

function stat(v, label) { return '<div class="stat"><b>' + v + '</b><span>' + label + '</span></div>'; }

/* The AI tools do not get their own key. They hand the job to the assistant on
   this site, which already has a backend and already knows the channel — one
   place where prompts live, one place to fix when something is wrong. */
const AI_PROMPTS = {
  'ai-title': 'Give me 10 YouTube title options for a video about: ',
  'ai-desc': 'Write a YouTube description with timestamps and a tag list for a video about: ',
  'ai-hook': 'Write 5 opening lines that stop the scroll for a video about: '
};
function aiTool(t) {
  return {
    html: ta('t', 'What is the video about?') +
      '<div class="btns"><button class="go" id="go">Ask the assistant</button></div>' +
      '<p class="note">This opens the NovaClip assistant with your request. It runs on this site\'s own ' +
      'backend and already knows your channel, so the answer is about <b>your</b> videos rather than a generic one.</p>',
    wire() {
      $('go').onclick = () => {
        const v = $('t').value.trim();
        if (!v) return;
        try { navigator.clipboard.writeText(AI_PROMPTS[t.id] + v); } catch (e) {}
        close();
        /* Open the widget if it is on the page; otherwise send them to the full
           AI page rather than silently doing nothing. */
        const toggle = document.querySelector('#n8n-chat .chat-window-toggle');
        if (toggle) { toggle.click(); }
        else location.href = 'ai.html';
      };
    }
  };
}

/* ---------------------------------------------------------------------------
   ONE URL PER TOOL
   Without this the whole catalogue is a single page and Google indexes one
   thing: "Tools". That is fatal for a site that plans to live on search, because
   nobody searches "tools" — they search "youtube thumbnail size" and "inches to
   cm", and each of those has to be a page that can rank and be linked.

   Hash routing rather than real paths, because this has to stay one static file
   with no server to rewrite URLs. Google does index #! -style fragments poorly,
   so the sitemap lists ?t= query URLs, which are crawled normally, and both
   forms open the same tool.
   --------------------------------------------------------------------------- */
function toolUrl(id) { return location.pathname + '?t=' + id; }

function setMeta(t) {
  document.title = t ? t.name + ' — free online tool' : 'NovaTools — 498 free online tools';
  const d = document.querySelector('meta[name="description"]');
  if (d) d.setAttribute('content', t ? t.desc + ' Free, instant, runs in your browser.' :
    '498 free browser tools: image resizers for every social platform, converters, counters and calculators. No signup, nothing uploaded.');
  let link = document.querySelector('link[rel="canonical"]');
  if (!link) { link = document.createElement('link'); link.rel = 'canonical'; document.head.appendChild(link); }
  link.href = location.origin + (t ? toolUrl(t.id) : location.pathname);
}

function open(id, fromUrl) {
  const t = TOOLS.find(x => x.id === id);
  if (!t) return;
  if (!fromUrl) history.pushState({ t: id }, '', toolUrl(id));
  setMeta(t);
  const impl = t.ai ? aiTool(t) : IMPL[t.id];
  $('sTitle').textContent = t.name;
  $('sDesc').textContent = t.desc;
  $('sBody').innerHTML = impl.html;
  $('sheet').classList.add('show');
  impl.wire();
}
function close(fromUrl) {
  $('sheet').classList.remove('show');
  if (!fromUrl) { history.pushState({}, '', location.pathname); setMeta(null); }
}
/* Back and forward move through the tools, which is what a URL per tool is for. */
addEventListener('popstate', () => {
  const id = new URLSearchParams(location.search).get('t');
  if (id && TOOLS.some(x => x.id === id)) open(id, true); else close(true);
});
$('sClose').onclick = close;
$('sheet').onclick = e => { if (e.target === $('sheet')) close(); };
document.addEventListener('keydown', e => { if (e.key === 'Escape') close(); });


/* ---- unit conversions as individual entries ----
   "cm to inches" is what people search for and it is a correct, specific
   answer, so it earns its own card. The engine underneath is one line. */
const UNIT_TABLES = {
  Length:{ m:1, km:1000, cm:0.01, mm:0.001, mile:1609.344, yard:0.9144, foot:0.3048, inch:0.0254, 'nautical mile':1852 },
  Weight:{ kg:1, g:0.001, mg:1e-6, tonne:1000, lb:0.45359237, oz:0.028349523, stone:6.35029318 },
  Volume:{ litre:1, ml:0.001, 'cubic metre':1000, gallon:3.785411784, quart:0.946352946, pint:0.473176473, cup:0.2365882365, 'fl oz':0.0295735296 },
  Area:{ 'sq metre':1, 'sq km':1e6, hectare:10000, 'sq foot':0.09290304, 'sq yard':0.83612736, acre:4046.8564224, 'sq mile':2589988.11 },
  Speed:{ 'km/h':1, 'm/s':3.6, mph:1.609344, knot:1.852 },
  Data:{ MB:1, KB:0.001, byte:1e-6, GB:1000, TB:1e6, MiB:1.048576, GiB:1073.741824 },
  Time:{ second:1, minute:60, hour:3600, day:86400, week:604800, month:2629800, year:31557600 },
  Energy:{ joule:1, kJ:1000, calorie:4.184, kcal:4184, 'watt hour':3600, 'kWh':3.6e6 }
};

/* Build the catalogue. Each generated entry is registered with its own id, its
   own implementation and its own parameters — the list and the code stay in
   step because both come from the same table. */
(function buildGenerated() {
  const add = (t, impl) => { TOOLS.push(t); IMPL[t.id] = impl; };
  const slug = s => s.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');

  /* --- one card per social placement, cropping to fill --- */
  SOCIAL_SIZES.forEach(([name, w, h, plat]) => add(
    { id: 'sz-' + slug(name), cat: 'social', name: 'Resize: ' + name,
      desc: 'Crop and export at exactly ' + w + ' × ' + h + '. Never leaves your device.' },
    { html: imgPick() +
        '<div class="btns"><button class="go" id="go">Make it ' + w + ' × ' + h + '</button></div>' + outBox +
        '<p class="note">Cropped from the centre to fill the frame, not squashed — a squashed face is worse than a cropped one.</p>',
      wire() {
        let img = null;
        onImg(i => { img = i;
          setOut('Loaded ' + i.naturalWidth + ' × ' + i.naturalHeight +
            (i.naturalWidth < w || i.naturalHeight < h ? '\n\nSmaller than ' + w + ' × ' + h + ' — it will be upscaled and look soft.' : '')); });
        $('go').onclick = () => {
          if (!img) return setOut('Choose an image first.', true);
          const c = document.createElement('canvas'); c.width = w; c.height = h;
          const ctx = c.getContext('2d'); ctx.imageSmoothingQuality = 'high';
          // cover: scale to the larger ratio, then centre what overflows
          const s = Math.max(w / img.naturalWidth, h / img.naturalHeight);
          const dw = img.naturalWidth * s, dh = img.naturalHeight * s;
          ctx.drawImage(img, (w - dw) / 2, (h - dh) / 2, dw, dh);
          c.toBlob(b => { if (!b) return setOut('The browser refused to encode that.', true);
            dl(URL.createObjectURL(b), slug(name) + '-' + w + 'x' + h + '.png');
            setOut('Saved ' + w + ' × ' + h + '  ·  ' + kb(b.size)); }, 'image/png');
        };
      } }));

  /* --- one live counter per platform field, with that field's real cap --- */
  SOCIAL_LIMITS.forEach(([name, max, plat, note]) => add(
    { id: 'lim-' + slug(name), cat: 'social', name: name + ' counter',
      desc: 'Live count against the real ' + max.toLocaleString() + '-character cap.' },
    { html: ta('t', 'Type or paste…') + '<div id="bar"></div>' +
        (note ? '<p class="note">' + note + '</p>' : ''),
      wire() {
        const run = () => {
          const n = $('t').value.length, over = n > max, pct = Math.min(100, n / max * 100);
          $('bar').innerHTML = '<div style="display:flex;justify-content:space-between;font-size:.86rem;margin-top:14px;color:' +
            (over ? '#FF2E97' : 'var(--dim)') + '"><span>' + name + '</span><span>' + n.toLocaleString() +
            ' / ' + max.toLocaleString() + (over ? '  — over by ' + (n - max).toLocaleString() : '') + '</span></div>' +
            '<div style="height:8px;border-radius:5px;background:rgba(255,255,255,0.07);margin-top:6px;overflow:hidden">' +
            '<div style="height:100%;width:' + pct + '%;background:' +
            (over ? '#FF2E97' : pct > 85 ? '#ffd24a' : 'var(--cyan)') + '"></div></div>';
        };
        $('t').oninput = run; run();
      } }));

  /* --- one calculator per formula --- */
  SOCIAL_CALC.forEach(([name, desc, labels, fn]) => add(
    { id: 'calc-' + slug(name), cat: 'social', name: name, desc: desc },
    { html: '<div class="row2">' + labels.map((l, i) => l ?
        '<div class="field"><label>' + l + '</label><input id="i' + i + '" type="number" step="any"></div>' : '').join('') +
        '</div><div class="stats" id="st"></div>',
      wire() {
        const run = () => {
          const a = parseFloat($('i0').value), b = $('i1') ? parseFloat($('i1').value) : undefined;
          if (isNaN(a)) return $('st').innerHTML = '';
          const res = fn(a, isNaN(b) ? 0 : b);
          if (!res) return $('st').innerHTML = '<p class="note">The second number cannot be zero.</p>';
          $('st').innerHTML = res.map(([v, unit, label]) => {
            const shown = unit === '$' ? '$' + (Math.round(v * 100) / 100).toLocaleString()
                                       : (Math.round(v * 100) / 100).toLocaleString() + unit;
            return stat(shown, label);
          }).join('');
        };
        labels.forEach((l, i) => { if (l && $('i' + i)) $('i' + i).oninput = run; });
      } }));

  /* --- one text utility per transform --- */
  SOCIAL_TEXT.forEach(([name, desc, fn]) => add(
    { id: 'tx-' + slug(name), cat: 'social', name: name, desc: desc },
    { html: ta('t', 'Paste your caption, script or list…') + goRow + outBox,
      wire() {
        const run = () => { try { setOut(fn($('t').value)); } catch (e) { setOut('That input broke it: ' + e.message, true); } };
        $('go').onclick = run; $('t').oninput = run; $('copy').onclick = copyOut;
      } }));

  /* --- every sensible unit pair, both directions --- */
  Object.entries(UNIT_TABLES).forEach(([kind, table]) => {
    const units = Object.keys(table);
    units.forEach(from => units.forEach(to => {
      if (from === to) return;
      add({ id: 'u-' + slug(kind + '-' + from + '-' + to), cat: 'converters',
            name: from + ' to ' + to, desc: kind + '. Type a number, get the answer.' },
          { html: '<div class="field"><label>' + from + '</label><input id="v" type="number" step="any" value="1"></div>' + outBox,
            wire() {
              const run = () => {
                const v = parseFloat($('v').value);
                if (isNaN(v)) return setOut('');
                const r = v * table[from] / table[to];
                setOut(v.toLocaleString() + ' ' + from + '  =  ' +
                  (Math.round(r * 1e6) / 1e6).toLocaleString() + ' ' + to);
              };
              $('v').oninput = run; run();
            } });
    }));
  });
})();

render();

/* Deep link on arrival: /tools.html?t=sz-youtube-thumbnail opens that tool with
   its own title, so a search result lands on the thing that was searched for. */
(function () {
  const id = new URLSearchParams(location.search).get('t') || location.hash.replace(/^#\/?/, '');
  if (id && TOOLS.some(x => x.id === id)) open(id, true); else setMeta(null);
})();

/* A one-line sitemap dump, so the file that search engines need can be produced
   from the catalogue rather than maintained by hand and drifting out of date.
   Run ncSitemap('https://yourdomain.com/') in the console and save the result. */
window.ncSitemap = function (base) {
  base = base || location.origin + '/';
  const today = new Date().toISOString().slice(0, 10);
  return '<?xml version="1.0" encoding="UTF-8"?>\n<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">\n' +
    '  <url><loc>' + base + '</loc><lastmod>' + today + '</lastmod><priority>1.0</priority></url>\n' +
    TOOLS.filter(t => !t.ai).map(t =>
      '  <url><loc>' + base + '?t=' + t.id + '</loc><lastmod>' + today + '</lastmod><priority>0.7</priority></url>')
      .join('\n') + '\n</urlset>';
};

</script>
</body>
