<?xml version="1.0" encoding="UTF-8"?>
<!--
  The same mark, redrawn for a 16px tab.

  Two changes from logo.svg, both because detail below 20px becomes noise: the
  satellite is gone, and the star is larger and centred so it fills the tile.
  An SVG favicon also scales to whatever the browser asks for and follows the
  page's colour scheme better than a bitmap, so there is no .ico here.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="f" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5A5BF6"/>
      <stop offset="0.55" stop-color="#00C3D6"/>
      <stop offset="1" stop-color="#FF8AD8"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#f)"/>
  <path fill="#fff"
        d="M32 8 Q37.2 26.8 56 32 Q37.2 37.2 32 56 Q26.8 37.2 8 32 Q26.8 26.8 32 8 Z"/>
</svg>
