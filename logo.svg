<?xml version="1.0" encoding="UTF-8"?>
<!--
  NovaTools mark.

  A four-bladed star with concave sides: a nova, and equally a set of tools
  radiating from one centre, which is what the site is. The small satellite is
  what stops it reading as the generic AI sparkle — it is off-axis on purpose,
  and it is the detail that makes the mark recognisable at a glance in a tab
  strip full of other blue squares.

  Drawn on a 64-unit grid so it lands on whole pixels at 16, 32 and 64. The
  gradient is the same three hues as --gradient-brand in the stylesheet.
  favicon.svg drops the satellite, because below about 20px it turns into a
  smudge; this file keeps it.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64"
     role="img" aria-label="NovaTools">
  <defs>
    <linearGradient id="ntg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5A5BF6"/>
      <stop offset="0.55" stop-color="#00C3D6"/>
      <stop offset="1" stop-color="#FF8AD8"/>
    </linearGradient>
  </defs>

  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#ntg)"/>

  <!-- the star: tips at 12 and 3 and 6 and 9 o'clock, waist pulled to 26% -->
  <path fill="#fff"
        d="M29 17 Q33.42 29.58 46 34 Q33.42 38.42 29 51 Q24.58 38.42 12 34 Q24.58 29.58 29 17 Z"/>

  <!-- the satellite, ringed so it stays separate from the star at small sizes -->
  <circle cx="47.5" cy="16.5" r="5" fill="#fff" fill-opacity="0.94"/>
</svg>
